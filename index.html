<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MeshCaching</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  :root { --bg:#111418; --card:#1c2128; --txt:#e8ecf1; --dim:#8b95a1; --lvl:#3a4350; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--txt);
         font-family:system-ui,-apple-system,Roboto,sans-serif; }
  main { max-width:480px; margin:0 auto; padding:12px 16px 24px; }
  header { display:flex; justify-content:space-between; align-items:baseline; }
  h1 { font-size:1.1rem; margin:0; }
  #conn { font-size:.8rem; color:var(--dim); }
  #conn.off { color:#ff6b6b; }
  #big { margin-top:12px; border-radius:16px; padding:18px 12px; text-align:center;
         background:var(--lvl); transition:background .4s; }
  #rssi { font-size:5.5rem; font-weight:800; line-height:1; font-variant-numeric:tabular-nums; }
  #rssi small { font-size:1.4rem; font-weight:600; }
  #lvl { font-size:1.5rem; font-weight:700; margin-top:4px; }
  #trend { font-size:1rem; margin-top:4px; min-height:1.2em; }
  .grid { display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; margin-top:12px; }
  .cell { background:var(--card); border-radius:12px; padding:10px; text-align:center; }
  .cell b { display:block; font-size:1.25rem; font-variant-numeric:tabular-nums; }
  .cell span { font-size:.75rem; color:var(--dim); }
  #age.stale { color:#ff9f43; }
  canvas { width:100%; height:170px; margin-top:12px; background:var(--card); border-radius:12px; }
  button { width:100%; margin-top:12px; padding:16px; font-size:1.2rem; font-weight:700;
           border:0; border-radius:12px; background:#2e86de; color:#fff; }
  button:disabled { background:#3a4350; color:var(--dim); }
  #pingMsg { min-height:1.3em; }
  .opts { display:flex; gap:20px; justify-content:center; margin-top:10px; color:var(--dim); }
  .opts label { display:flex; align-items:center; gap:6px; }
  #map { width:100%; height:360px; margin-top:18px; border-radius:12px; background:var(--card); }
  .leaflet-bar a.locate { display:flex; align-items:center; justify-content:center; }
  .leaflet-bar a.locate svg { width:18px; height:18px; }
  [hidden] { display:none !important; }
  #geoMsg { text-align:center; color:var(--dim); font-size:.85rem; min-height:1.2em; margin-top:6px; }
  #clear { padding:10px; font-size:.95rem; background:var(--card); color:var(--dim); }
  #link .msg, #pingMsg { text-align:center; color:var(--dim); font-size:.9rem; margin-top:6px; }
  #log { margin:10px 0 0; font-size:.7rem; color:var(--dim); white-space:pre-wrap; word-break:break-all; }
  footer { margin-top:14px; font-size:.75rem; color:var(--dim); text-align:center; }
</style>
</head>
<body>
<main>
  <header><h1>Répéteur <span id="target">----</span></h1><span id="conn" class="off">déconnecté</span></header>

  <div id="link">
    <button id="bRec" hidden>Reconnecter</button>
    <button id="bBle" hidden>Connexion Bluetooth</button>
    <button id="bSer" hidden>Connexion USB (câble)</button>
    <div class="msg" id="linkMsg"></div>
  </div>

  <section id="big">
    <div id="rssi">--<small> dBm</small></div>
    <div id="lvl">En attente de paquets…</div>
    <div id="trend"></div>
  </section>

  <div class="grid">
    <div class="cell"><b id="snr">--</b><span>SNR (dB)</span></div>
    <div class="cell"><b id="age">--</b><span>dernier paquet</span></div>
    <div class="cell"><b id="count">0</b><span>détections</span></div>
  </div>

  <canvas id="chart"></canvas>

  <button id="ping" disabled>Ping le répéteur</button>
  <div id="pingMsg">Touchez la page une fois pour activer vibration et bip.</div>

  <div class="opts">
    <label><input type="checkbox" id="vib" checked> Vibration</label>
    <label><input type="checkbox" id="beep"> Bip</label>
    <label><input type="checkbox" id="awake" checked> Écran allumé</label>
  </div>

  <div id="map"></div>
  <div id="geoMsg"></div>
  <button id="clear">Effacer l’historique et les positions</button>

  <footer><span id="why"></span> · <span id="rx">0</span> paquets entendus au total<pre id="log"></pre></footer>
</main>

<script>
const $ = id => document.getElementById(id);
const HIST_MS = 10 * 60 * 1000;   // le graphique montre les 10 dernieres minutes
const MAX_POINTS = 2000;           // positions gardees (localStorage limite a ~5 Mo)

// --- Sauvegarde locale : l'historique survit au rechargement de la page ---
const STORE = 'meshcaching';
let saved = {};
try { saved = JSON.parse(localStorage.getItem(STORE)) || {}; } catch (e) {}
let lastSeq = saved.lastSeq ?? -1, prevRssi = saved.prevRssi ?? null, hist = saved.hist || [], audio = null;
let points = saved.points || [], target = saved.target || null, base = saved.base || 'Plan';
let here = null, lmap = null, llayer = null;

function save() {
  try {
    localStorage.setItem(STORE, JSON.stringify({ lastSeq, prevRssi, hist, points, target, base }));
  } catch (e) {}
}

// Niveau "chaud / froid" en fonction du RSSI
function level(r) {
  if (r > -70)  return ['Brûlant', '#c0392b'];
  if (r > -85)  return ['Chaud',   '#e67e22'];
  if (r > -100) return ['Tiède',   '#b7950b'];
  if (r > -112) return ['Froid',   '#2471a3'];
  return ['Glacial', '#6c3483'];
}

function fmtAge(s) {
  if (s < 60) return s + ' s';
  if (s < 3600) return Math.floor(s / 60) + ' min ' + String(s % 60).padStart(2, '0');
  return Math.floor(s / 3600) + ' h ' + String(Math.floor(s / 60) % 60).padStart(2, '0');
}

// Bip dont la hauteur monte avec le RSSI (-120 dBm grave -> -50 dBm aigu)
function beep(r) {
  if (!audio) return;
  const o = audio.createOscillator(), g = audio.createGain();
  const k = Math.min(1, Math.max(0, (r + 120) / 70));
  o.frequency.value = 300 + k * 1200;
  g.gain.setValueAtTime(0.25, audio.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, audio.currentTime + 0.25);
  o.connect(g); g.connect(audio.destination);
  o.start(); o.stop(audio.currentTime + 0.25);
}

// L'audio d'un navigateur ne peut demarrer qu'apres un geste de l'utilisateur
$('beep').addEventListener('change', e => {
  if (e.target.checked) {
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    audio.resume();
    beep(-85);
  }
});

function drawChart() {
  const c = $('chart'), dpr = window.devicePixelRatio || 1;
  c.width = c.clientWidth * dpr; c.height = c.clientHeight * dpr;
  const x = c.getContext('2d'), W = c.width, H = c.height, now = Date.now();
  hist = hist.filter(p => now - p.t < HIST_MS);
  // Echelle adaptee aux valeurs affichees (+/- 5 dB, arrondi a 10, 30 dB au moins)
  const rs = hist.map(p => p.r);
  let lo = -130, hi = -40;
  if (rs.length) {
    hi = Math.ceil((Math.max(...rs) + 5) / 10) * 10;
    lo = Math.min(Math.floor((Math.min(...rs) - 5) / 10) * 10, hi - 30);
  }
  const yOf = r => H - (r - lo) / (hi - lo) * H;
  x.font = (10 * dpr) + 'px sans-serif';
  x.strokeStyle = '#2c333d'; x.fillStyle = '#8b95a1'; x.lineWidth = dpr;
  const step = hi - lo > 60 ? 20 : 10;
  for (let r = Math.floor(lo / step) * step + step; r < hi; r += step) {
    x.beginPath(); x.moveTo(0, yOf(r)); x.lineTo(W, yOf(r)); x.stroke();
    x.fillText(r, 4 * dpr, yOf(r) - 3 * dpr);
  }
  if (!hist.length) return;
  const xOf = t => W - (now - t) / HIST_MS * W;
  x.strokeStyle = '#8b95a1'; x.beginPath();
  hist.forEach((p, i) => i ? x.lineTo(xOf(p.t), yOf(p.r)) : x.moveTo(xOf(p.t), yOf(p.r)));
  x.stroke();
  for (const p of hist) {
    x.fillStyle = level(p.r)[1];
    x.beginPath(); x.arc(xOf(p.t), yOf(p.r), 4 * dpr, 0, 7); x.fill();
  }
}

// --- Liaison avec le boitier : Bluetooth (Nordic UART) ou port serie USB ---
// Les deux transportent les memes lignes de texte terminees par '\n'.
// On envoie "j" chaque seconde, le boitier repond une ligne JSON ; "p" = ping.
const NUS = '6e400001-b5a3-f393-e0a9-e50e24dcca9e';
const NUS_RX = '6e400002-b5a3-f393-e0a9-e50e24dcca9e', NUS_TX = '6e400003-b5a3-f393-e0a9-e50e24dcca9e';
const enc = new TextEncoder();
let send = null, kind = null, dev = null, port = null, devName = '';
let buf = '', dec = null, lastJson = 0, retry = null, logLines = [];

function setConn(txt, off) { $('conn').textContent = txt; $('conn').className = off ? 'off' : ''; }

// Les notifications Bluetooth arrivent par morceaux de 20 octets : on
// recolle, puis on coupe aux fins de ligne. Le decodeur "stream" garde les
// accents coupes en deux entre deux morceaux.
function onChunk(bytes) {
  buf += dec.decode(bytes, { stream: true });
  if (buf.length > 8192) buf = '';  // jamais de fin de ligne : on repart a zero
  let i;
  while ((i = buf.indexOf('\n')) >= 0) {
    const l = buf.slice(0, i).trim();
    buf = buf.slice(i + 1);
    if (l[0] === '{') { try { onStatus(JSON.parse(l)); } catch (e) {} }
    else if (l) { logLines = [...logLines, l].slice(-6); $('log').textContent = logLines.join('\n'); }
  }
}

function linked(name) {
  devName = name; buf = ''; lastJson = Date.now();
  setConn('connecté · ' + name);
  $('link').hidden = true;
  send('j\n');
}

// Perte de liaison : l'historique reste, on propose (et tente) de reconnecter
function lost(err) {
  if (!send && err === undefined && !$('link').hidden) return;  // deja signale
  send = null;
  setConn('déconnecté', true);
  $('ping').disabled = true;
  $('link').hidden = false;
  $('bRec').hidden = !kind;
  $('linkMsg').textContent = err ? 'Erreur : ' + (err.message || err) : '';
  // En Bluetooth on retente seul (sortie de portee, boitier redemarre...)
  clearTimeout(retry);
  if (kind === 'ble') retry = setTimeout(() => connectBle(false).catch(lost), 5000);
}

async function connectBle(pick) {
  if (pick) {
    // Nom et service ne tiennent pas ensemble dans une annonce de 31 octets :
    // on accepte l'un ou l'autre.
    dev = await navigator.bluetooth.requestDevice({ filters: [{ namePrefix: 'MeshCaching' }, { services: [NUS] }], optionalServices: [NUS] });
    dev.addEventListener('gattserverdisconnected', () => lost());
    kind = 'ble';
  }
  clearTimeout(retry);
  setConn('connexion…');
  dec = new TextDecoder();
  const srv = await (await dev.gatt.connect()).getPrimaryService(NUS);
  const rx = await srv.getCharacteristic(NUS_RX), tx = await srv.getCharacteristic(NUS_TX);
  tx.oncharacteristicvaluechanged = e => onChunk(new Uint8Array(e.target.value.buffer, e.target.value.byteOffset, e.target.value.byteLength));  // "=" : pas de doublon apres reconnexion
  await tx.startNotifications();
  // Une seule ecriture GATT a la fois, sinon Chrome refuse : on les enchaine
  let q = Promise.resolve();
  const w = rx.properties.writeWithoutResponse ? b => rx.writeValueWithoutResponse(b) : b => rx.writeValue(b);
  send = s => { q = q.then(() => w(enc.encode(s))).catch(() => {}); };
  linked(dev.name);
}

// Sur Android, le Web Serial natif de Chrome ne voit pas le port USB de
// l'ESP32-S3 : on passe par le polyfill de Google, qui parle au port en WebUSB.
// Sur ordinateur, le pilote du systeme tient le port : Web Serial natif.
// Charge des l'ouverture : Chrome n'ouvre le choix du port que juste apres le toucher.
const ANDROID = /Android/i.test(navigator.userAgent) && 'usb' in navigator;
const serialApi = ANDROID ? import('https://cdn.jsdelivr.net/npm/web-serial-polyfill@1.0.15/dist/serial.js').then(m => m.serial)
                          : Promise.resolve(navigator.serial);
serialApi.catch(() => {});  // sans reseau : l'erreur s'affichera au clic
// Le polyfill plante sur les paquets USB vides que l'ESP32-S3 envoie ("chunk
// is empty") : on lit nous-memes le point d'entree USB, en sautant ces paquets.
// ponytail: device_/inEndpoint_ sont internes au polyfill, version figee 1.0.15.
const usbReader = p => ({
  async read() {
    for (;;) {
      const r = await p.device_.transferIn(p.inEndpoint_.endpointNumber, 1024);
      if (r.status !== 'ok') throw new Error('USB ' + r.status);
      if (r.data.byteLength) return { value: new Uint8Array(r.data.buffer, r.data.byteOffset, r.data.byteLength) };
    }
  },
  releaseLock() {},
});
async function connectSerial(pick) {
  if (pick) {
    port = await (await serialApi).requestPort();
    kind = 'serial';
  }
  setConn('connexion…');
  dec = new TextDecoder();
  await port.open({ baudRate: 115200 });
  const wr = port.writable.getWriter(), rd = port.device_ ? usbReader(port) : port.readable.getReader();
  send = s => { wr.write(enc.encode(s)).catch(() => {}); };
  linked('USB');
  let err;
  try {
    for (;;) {
      const { value, done } = await rd.read();
      if (done) break;
      onChunk(value);
    }
  } catch (e) { err = e; }  // cable debranche
  try { rd.releaseLock(); wr.releaseLock(); await port.close(); } catch (e) {}
  lost(err);
}

function connect(fn, pick) {
  $('linkMsg').textContent = '';
  fn(pick).catch(e => { if (e.name !== 'NotFoundError') lost(e); else if (!send) setConn('déconnecté', true); });
}
if ('bluetooth' in navigator) $('bBle').hidden = false;
if ('serial' in navigator || ANDROID) $('bSer').hidden = false;
if ($('bBle').hidden && $('bSer').hidden)
  $('linkMsg').textContent = 'Ce navigateur ne sait parler ni Bluetooth ni USB : utilisez Chrome (Android ou ordinateur) ou Edge.';
$('bBle').addEventListener('click', () => connect(connectBle, true));
$('bSer').addEventListener('click', () => connect(connectSerial, true));
$('bRec').addEventListener('click', () => connect(kind === 'ble' ? connectBle : connectSerial, false));

function onStatus(s) {
  lastJson = Date.now();
  setConn('connecté · ' + devName);
  $('target').textContent = s.target;
  // Nouveau repeteur cible : l'historique de l'ancien ne veut plus rien dire
  if (target !== s.target) {
    if (target) { hist = []; points = []; prevRssi = null; drawMap(true); }
    target = s.target;
    save();
  }
  $('rx').textContent = s.rx;
  $('count').textContent = s.seq;

  if (s.has) {
    const [name, color] = level(s.rssi);
    $('rssi').innerHTML = Math.round(s.rssi) + '<small> dBm</small>';
    $('lvl').textContent = name;
    $('big').style.background = color;
    $('snr').textContent = s.snr.toFixed(1);
    $('age').textContent = fmtAge(s.age);
    $('age').className = s.age > 120 ? 'stale' : '';
    $('why').textContent = 'dernière détection : ' + s.why;

    if (s.seq !== lastSeq) {
      // Nouveau paquet du repeteur (on ignore le tout premier affichage)
      if (lastSeq >= 0) {
        if (prevRssi !== null) {
          const d = Math.round(s.rssi - prevRssi);
          $('trend').textContent = d > 0 ? '▲ +' + d + ' dB, plus chaud' : d < 0 ? '▼ ' + d + ' dB, plus froid' : '= stable';
        }
        if ($('vib').checked && navigator.vibrate) navigator.vibrate(s.rssi > -85 ? [80, 60, 80, 60, 80] : [200]);
        if ($('beep').checked) beep(s.rssi);
      }
      hist.push({ t: Date.now() - s.age * 1000, r: s.rssi });
      prevRssi = s.rssi;
      lastSeq = s.seq;
      recordPoint(s);
      save();
    }
  }
  $('ping').disabled = s.pingWait > 0;
  $('ping').textContent = s.pingWait > 0 ? 'Ping possible dans ' + s.pingWait + ' s' : 'Ping le répéteur';
  drawChart();
}

// Chaque seconde : demande d'etat, et alerte si le boitier ne repond plus
function tick() {
  if (send) {
    send('j\n');
    if (Date.now() - lastJson > 3500) setConn('pas de réponse · ' + devName, true);
  }
  drawChart();
}

$('ping').addEventListener('click', () => {
  if (!send) return;
  $('ping').disabled = true;
  send('p\n');
  $('pingMsg').textContent = 'Ping envoyé, réponse attendue sous 10 s…';
});

// --- Positions GPS ---
function startGeo() {
  if (!navigator.geolocation) { $('geoMsg').textContent = 'GPS indisponible sur ce navigateur'; return; }
  navigator.geolocation.watchPosition(p => onPos(p, false), onGeoErr, { enableHighAccuracy: true, maximumAge: 5000 });
}

function onPos(p, fit) {
  here = { lat: p.coords.latitude, lon: p.coords.longitude, acc: p.coords.accuracy, t: Date.now() };
  $('geoMsg').textContent = 'Position à ±' + Math.round(here.acc) + ' m · ' + points.length + ' points';
  drawMap(fit);
}
function onGeoErr(e) { $('geoMsg').textContent = 'GPS indisponible : ' + e.message; }

// On note ou l'on etait a chaque paquet du repeteur, si le paquet et la
// position sont recents (sinon le point serait faux).
function recordPoint(s) {
  if (!here || Date.now() - here.t > 30000 || s.age > 15) return;
  points.push({ t: Date.now() - s.age * 1000, lat: here.lat, lon: here.lon,
                acc: Math.round(here.acc), r: s.rssi, snr: s.snr });
  if (points.length > MAX_POINTS) points.shift();
  drawMap(false);
}

function strongest() {
  return points.reduce((best, p) => (!best || p.r > best.r ? p : best), null);
}

// --- Carte : Leaflet, fond plan (OpenStreetMap) ou satellite (Esri) ---
// Au-dela du zoom 19 (le plus fin des deux fonds), Leaflet agrandit les tuiles.
// Sans reseau Leaflet ne se charge pas : la liaison avec le boitier marche quand meme.
function initMap() {
  if (!window.L) { $('geoMsg').textContent = 'Carte indisponible (pas de réseau)'; return; }
  lmap = L.map('map');
  const bases = {
    Plan: L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',
                      { maxZoom: 25, maxNativeZoom: 19, attribution: '© OpenStreetMap' }),
    Satellite: L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
                           { maxZoom: 25, maxNativeZoom: 19, attribution: '© Esri' }),
  };
  (bases[base] || bases.Plan).addTo(lmap);
  L.control.layers(bases, null, { position: 'topright' }).addTo(lmap);
  lmap.on('baselayerchange', e => { base = e.name; save(); });
  llayer = L.layerGroup().addTo(lmap);

  // Bouton "ma position" dans le style des boutons +/- : position fraiche
  // (pas de cache) a la demande, puis carte centree dessus
  const Locate = L.Control.extend({
    onAdd() {
      const bar = L.DomUtil.create('div', 'leaflet-bar');
      const a = L.DomUtil.create('a', 'locate', bar);
      a.href = '#'; a.title = 'Ma position précise'; a.setAttribute('role', 'button');
      a.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">'
        + '<circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="2.5" fill="currentColor"/>'
        + '<path d="M12 1v4M12 19v4M1 12h4M19 12h4"/></svg>';
      L.DomEvent.disableClickPropagation(bar);
      L.DomEvent.on(a, 'click', e => { L.DomEvent.preventDefault(e); locate(); });
      return bar;
    },
  });
  new Locate({ position: 'bottomright' }).addTo(lmap);
  drawMap(true);
}

function locate() {
  if (!navigator.geolocation) return;
  $('geoMsg').textContent = 'Recherche de la position précise…';
  navigator.geolocation.getCurrentPosition(p => {
    onPos(p, false);
    if (lmap) lmap.setView([here.lat, here.lon], Math.max(lmap.getZoom(), 17));
  }, onGeoErr,
                                           { enableHighAccuracy: true, maximumAge: 0, timeout: 20000 });
}

// Les points ne sont reconstruits que s'ils ont change (sinon une bulle
// ouverte se refermerait a chaque mise a jour GPS) ; notre position bouge seule.
let lastDrawn = null, hereDot = null, hereRing = null;
function drawMap(fit) {
  if (!lmap) return;
  const last = points[points.length - 1] || null;
  if (last !== lastDrawn || fit) {
    lastDrawn = last;
    llayer.clearLayers();
    const best = strongest();
    for (const p of points) {
      L.circleMarker([p.lat, p.lon], { radius: 6, color: p === best ? '#fff' : '#000',
                                       weight: p === best ? 3 : 1, fillColor: level(p.r)[1], fillOpacity: 0.9 })
        .bindPopup(Math.round(p.r) + ' dBm · SNR ' + p.snr.toFixed(1) + ' · ' + new Date(p.t).toLocaleTimeString())
        .addTo(llayer);
    }
  }
  if (here) {
    if (!hereDot) {
      // Non cliquables : ils sont dessines par-dessus les points, qui doivent rester touchables
      hereRing = L.circle([here.lat, here.lon], { radius: here.acc, color: '#4aa3ff', weight: 1, interactive: false }).addTo(lmap);
      hereDot = L.circleMarker([here.lat, here.lon], { radius: 5, color: '#4aa3ff', fillOpacity: 1, interactive: false }).addTo(lmap);
    }
    hereRing.setLatLng([here.lat, here.lon]).setRadius(here.acc);
    hereDot.setLatLng([here.lat, here.lon]);
  }
  if (fit) {
    const all = points.map(p => [p.lat, p.lon]);
    if (here) all.push([here.lat, here.lon]);
    if (all.length) lmap.fitBounds(all, { maxZoom: 18, padding: [20, 20] });
    else lmap.setView([48.8566, 2.3522], 11);  // Paris par defaut
  }
}

$('clear').addEventListener('click', () => {
  if (!confirm('Effacer l’historique RSSI et les positions enregistrées ?')) return;
  hist = []; points = []; prevRssi = null;
  save(); drawChart(); drawMap(true);
});

initMap();
startGeo();
// Ecran allume pendant la chasse : le navigateur relache le verrou des que
// la page est cachee, on le reprend quand elle revient au premier plan.
let lock = null;
async function keepAwake() {
  if (!navigator.wakeLock || document.hidden) return;
  if (!$('awake').checked) { if (lock) lock.release(); lock = null; return; }
  if (!lock || lock.released) try { lock = await navigator.wakeLock.request('screen'); } catch (e) {}
}
if (!navigator.wakeLock) $('awake').parentElement.hidden = true;
$('awake').addEventListener('change', keepAwake);
document.addEventListener('visibilitychange', keepAwake);
keepAwake();

tick();
setInterval(tick, 1000);
window.addEventListener('resize', drawChart);
</script>
