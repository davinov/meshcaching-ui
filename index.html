<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MeshCaching</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#111418">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
<script type="module" src="js/main.js"></script>
</head>
<body>
<main>
  <header><h1>Répéteur <span id="target">----</span></h1><span id="conn" class="off">déconnecté</span></header>

  <div id="link">
    <button id="bRec" hidden>Reconnecter</button>
    <button id="bBle" hidden>Connexion Bluetooth</button>
    <button id="bSer" hidden>Connexion USB (câble)</button>
    <div class="msg" id="linkMsg"></div>
  </div>

  <section id="big">
    <div id="rssi">--<small> dBm</small></div>
    <div id="lvl">En attente de paquets…</div>
    <div id="trend"></div>
  </section>

  <div class="grid">
    <div class="cell"><b id="snr">--</b><span>SNR (dB)</span></div>
    <div class="cell"><b id="age">--</b><span>dernier paquet</span></div>
    <div class="cell"><b id="count">0</b><span>détections</span></div>
  </div>

  <canvas id="chart"></canvas>

  <button id="ping" disabled>Ping le répéteur</button>
  <div class="msg" id="pingMsg">Touchez la page une fois pour activer vibration et bip.</div>

  <div class="opts">
    <label><input type="checkbox" id="vib" checked> Vibration</label>
    <label><input type="checkbox" id="beep"> Bip</label>
    <label><input type="checkbox" id="awake" checked> Écran allumé</label>
  </div>

  <div id="map"></div>
  <div class="msg" id="geoMsg"></div>
  <button class="sub" id="manage">Gérer les points enregistrés</button>
  <button class="sub" id="clear">Effacer l’historique et les positions</button>

  <dialog id="pts">
    <header><h2>Points enregistrés <span id="ptsN"></span></h2><button id="ptsClose" aria-label="Fermer">✕</button></header>
    <div class="row"><button id="exp">Exporter</button><button id="imp">Importer</button></div>
    <input type="file" id="impFile" accept=".json,application/json" hidden>
    <div class="msg" id="ptsMsg"></div>
    <ol id="ptsList"></ol>
  </dialog>

  <footer><span id="why"></span> · <span id="rx">0</span> paquets entendus au total<pre id="log"></pre></footer>
</main>
</body>
</html>
